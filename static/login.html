<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CastZone — Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="login-page">
    <div class="login-card">

        <div class="login-logo">
            <div class="login-logo-mark">
                <svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 2h4v4H2zM8 2h4v4H8zM2 8h4v4H2zM8 8h4v4H8z"/>
                </svg>
            </div>
            <h1>CastZone</h1>
        </div>

        <p class="login-subtitle">Sistema de gestión de ventas</p>

        <div id="error-message" class="login-error"></div>

        <form id="login-form">
            <div class="login-form-group">
                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Ingresá tu usuario"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="login-form-group">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Ingresá tu contraseña"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="login-btn" id="login-btn">
                Iniciar sesión
            </button>
        </form>

        <div class="login-demo-banner">
            <p class="login-demo-title">🚀 Probá el sistema sin registrarte</p>
            <button type="button" class="login-demo-btn" onclick="loginDemo()">
                👉 Probar demo
            </button>
            <p class="login-demo-hint">Usuario: <strong>demo</strong> &nbsp;·&nbsp; Contraseña: <strong>demo123</strong></p>
        </div>

        <div class="login-divider"></div>

        <div class="login-footer">
            <p>¿No tenés cuenta? <a href="#" onclick="showRegisterForm(event)">Registrate aquí</a></p>
        </div>

    </div>
</div>

<!-- Modal para registro -->
<div id="register-modal" class="modal hidden">
    <div class="modal-content" style="text-align: left; max-width: 400px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <h3 style="margin: 0; font-size: 1.125rem; color: var(--text-1);">Crear cuenta</h3>
            <button onclick="hideRegisterForm()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-3); line-height: 1;">&times;</button>
        </div>

        <p style="color: var(--text-3); font-size: 0.875rem; margin-bottom: 1.5rem;">Completá los datos para registrarte</p>

        <div id="register-error" class="login-error"></div>

        <form id="register-form">
            <div class="login-form-group">
                <label for="register-username">Usuario</label>
                <input
                    type="text"
                    id="register-username"
                    placeholder="Elegí un usuario"
                    required
                >
            </div>

            <div class="login-form-group">
                <label for="register-password">Contraseña</label>
                <input
                    type="password"
                    id="register-password"
                    placeholder="Mínimo 6 caracteres"
                    required
                >
            </div>

            <button type="submit" class="login-btn" style="margin-top: 0.25rem;">
                Crear cuenta
            </button>
        </form>

        <button
            onclick="hideRegisterForm()"
            class="btn btn-secondary"
            style="width: 100%; margin-top: 0.75rem;"
        >
            Cancelar
        </button>
    </div>
</div>

<script src="/js/auth.js"></script>
<script>
function loginDemo() {
    document.getElementById('username').value = 'demo';
    document.getElementById('password').value = 'demo123';
    document.getElementById('login-form').dispatchEvent(new Event('submit'));
}
</script>
</body>
</html>
